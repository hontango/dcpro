<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC Pro">
<meta name="theme-color" content="#0f2460">
<title>DC Pro — 確定拠出年金 AIアドバイザー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2460;
    --navy-mid: #1a3580;
    --navy-light: #2548a8;
    --accent: #4fc3f7;
    --accent-gold: #f0c040;
    --accent-glow: rgba(79,195,247,0.18);
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.08);
    --border: rgba(79,195,247,0.18);
    --text: #e8eaf6;
    --text-muted: #8899cc;
    --user-bubble: linear-gradient(135deg, #1a3580 0%, #2548a8 100%);
    --ai-bubble: rgba(255,255,255,0.06);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; height: 100dvh;
    background: var(--navy);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    overflow: hidden;
  }

  /* Background mesh */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,72,168,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(15,36,96,0.8) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 70% 20%, rgba(79,195,247,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100%; height: 100dvh;
    max-width: 780px; margin: 0 auto;
  }

  /* Header */
  header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px 14px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    background: rgba(15,36,96,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .logo-badge {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent) 0%, #1565c0 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px; font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(79,195,247,0.3);
  }

  .header-text h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px; font-weight: 700;
    color: #fff; letter-spacing: 1px;
    line-height: 1.1;
  }

  .header-text p {
    font-size: 11px; color: var(--text-muted);
    margin-top: 1px; letter-spacing: 0.3px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 6px #4caf50;
    margin-left: auto;
    animation: pulse-dot 2.5s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse-dot {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  /* Quick tags */
  .quick-tags {
    flex-shrink: 0;
    display: flex; gap: 8px;
    overflow-x: auto; 
    padding: 10px 20px;
    background: rgba(15,36,96,0.6);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .quick-tags::-webkit-scrollbar { display: none; }

  .tag {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tag:hover, .tag:active {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: #fff;
  }

  /* Messages area */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Welcome card */
  .welcome-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    animation: fadeUp 0.6s ease;
  }
  .welcome-card .icon { font-size: 36px; margin-bottom: 12px; }
  .welcome-card h2 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .welcome-card p { font-size: 13px; color: var(--text-muted); line-height: 1.7; }

  /* Message bubbles */
  .msg {
    display: flex; gap: 10px;
    animation: fadeUp 0.3s ease;
    max-width: 100%;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; align-self: flex-end;
  }

  .msg.ai .avatar {
    background: linear-gradient(135deg, var(--accent) 0%, var(--navy-light) 100%);
    box-shadow: 0 0 10px rgba(79,195,247,0.25);
  }

  .msg.user .avatar {
    background: var(--navy-light);
  }

  .bubble {
    max-width: calc(100% - 50px);
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.7;
    font-size: 14px;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .msg.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  /* Typing indicator */
  .typing-dots {
    display: flex; gap: 5px; align-items: center; padding: 4px 2px;
  }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: calc(12px + var(--safe-bottom));
    background: rgba(15,36,96,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
  }

  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79,195,247,0.1);
  }

  #userInput {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    min-height: 24px; max-height: 160px;
    overflow-y: auto;
    padding: 3px 0;
    -webkit-overflow-scrolling: touch;
  }

  #userInput::placeholder { color: var(--text-muted); }

  #sendBtn {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--navy-light) 100%);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 0 12px rgba(79,195,247,0.3);
  }

  #sendBtn:hover { transform: scale(1.05); }
  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled { opacity: 0.4; transform: none; cursor: not-allowed; }

  #sendBtn svg { width: 18px; height: 18px; fill: #fff; }

  .footer-note {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  /* Markdown-like formatting in AI messages */
  .bubble strong { color: var(--accent-gold); }
  .bubble em { color: var(--accent); font-style: normal; }
  .bubble br + br { display: block; content: ''; margin: 4px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-badge">DC</div>
    <div class="header-text">
      <h1>DC PRO ADVISOR</h1>
      <p>確定拠出年金 / iDeCo 専門AIアドバイザー</p>
    </div>
    <div class="status-dot" title="オンライン"></div>
  </header>

  <div class="quick-tags">
    <div class="tag" onclick="quickAsk('2027年改正の内容を教えてください')">📋 2027年改正</div>
    <div class="tag" onclick="quickAsk('10年ルールとは何ですか？')">⏰ 10年ルール</div>
    <div class="tag" onclick="quickAsk('DCの節税効果を計算してください')">💰 節税計算</div>
    <div class="tag" onclick="quickAsk('iDeCoと企業型DCの違いは？')">🔄 iDeCo vs 企業DC</div>
    <div class="tag" onclick="quickAsk('受取方法（一時金・年金）のどちらが得ですか？')">📊 受取方法</div>
    <div class="tag" onclick="quickAsk('マッチング拠出について教えてください')">🤝 マッチング</div>
    <div class="tag" onclick="quickAsk('運用商品の選び方を教えてください')">📈 運用商品</div>
    <div class="tag" onclick="quickAsk('ポートフォリオの見直しタイミングは？')">⚖️ リバランス</div>
  </div>

  <div id="messages">
    <div class="welcome-card">
      <div class="icon">🏦</div>
      <h2>DC Pro AIアドバイザーへようこそ</h2>
      <p>確定拠出年金（企業型DC・iDeCo）に関する<br>あらゆる疑問にお答えします。<br>2026年最新改正情報にも完全対応しています。</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="DCについて何でも聞いてください…" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()" title="送信">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="footer-note">DC Pro v1.0 — 情報は参考目的です。個別の判断は専門家にご相談ください。</p>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxotILQLHbo77NMyJAx2WpmLtyge9r34nJQw8UUL-Psm7ql9o3S7edKPFHg1CMVm8mJ/exec';
const MODEL = 'claude-sonnet-4-6-20260217';

const SYSTEM_PROMPT = `あなたは「DC Proアドバイザー」という確定拠出年金（DC・iDeCo）専門のAIアドバイザーです。
ユーザーのライフプランやDCに関する悩みに、大変優秀で親身な専門家として回答してください。

【最新法改正情報（2026年時点）】
- 受給開始時期の選択肢が「5年ルール」から「10年ルール」に変更（2024年12月施行）
- iDeCoの加入可能年齢が65歳まで拡大
- 企業型DCとiDeCoの同時加入が原則全会社員に解禁
- 拠出限度額の引き上げ（2024年12月〜）：企業型DC最大5.5万円/月
- 2027年改正に向けた追加議論進行中（受給開始年齢の更なる柔軟化等）
- 退職所得控除の見直し議論（現行制度は維持中）

【回答スタイル】
- 親身で分かりやすい専門家として振る舞う
- 具体的な数字・計算例を積極的に使う
- 税制優遇・節税効果は特に丁寧に説明する
- 「やることリスト」など実践的なアドバイスを含める
- 回答は適度な長さで、読みやすく整理する
- 必要に応じてユーザーの個人状況（年齢・年収・勤務先など）を確認する

【注意事項】
- 個別の投資判断は「参考情報」として提供し、最終決定は専門家相談を促す
- 法改正情報は最新のものを提供するが、確定前の情報は「予定・議論中」と明記する`;

let conversationHistory = [];
let isLoading = false;

// Auto-resize textarea
const textarea = document.getElementById('userInput');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
});

textarea.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.metaKey) {
    e.preventDefault();
    sendMessage();
  }
});

function quickAsk(text) {
  const input = document.getElementById('userInput');
  input.value = text;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendMessage();
}

function addMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'ai' ? '🤖' : '👤';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(text);

  div.appendChild(avatar);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      redirect: 'follow',
      mode: 'cors',
      body: JSON.stringify({
        model: MODEL,
        system: SYSTEM_PROMPT,
        messages: conversationHistory,
        max_tokens: 1500
      })
    });

    removeTyping();

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText.substring(0, 200)}`);
    }

    const data = await response.json();

    let replyText = '';
    if (data.content && data.content[0] && data.content[0].text) {
      replyText = data.content[0].text;
    } else if (data.error) {
      replyText = `エラー: ${data.error.message || JSON.stringify(data.error)}`;
    } else {
      replyText = `予期しないレスポンス形式: ${JSON.stringify(data).substring(0, 200)}`;
    }

    addMessage('ai', replyText);
    conversationHistory.push({ role: 'assistant', content: replyText });

  } catch (fetchErr) {
    removeTyping();
    const errMsg = fetchErr.message || String(fetchErr);
    addMessage('ai', `⚠️ **通信エラーが発生しました**\n\nエラー詳細: ${errMsg}\n\nしばらく待ってから再度お試しください。`);
    // Remove failed user message from history
    conversationHistory.pop();
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
